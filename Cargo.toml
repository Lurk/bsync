[package]
name = "bsync"
version = "0.1.0"
edition = "2024"

[dependencies]
notify = "8.2.0"
globset = "0.4.18"
ignore = "0.4.25"
toml = "1.1.2+spec-1.1.0"
serde = { version = "1.0.228", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
walkdir = "2.5.0"
signal-hook = "0.4.4"
libc = "0.2.183"
clap = { version = "4.6.1", features = ["derive"] }
regex = "1.12.3"

[dev-dependencies]
tempfile = "3.27.0"
